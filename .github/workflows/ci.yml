# CI（設計書 §6.6 の手順 1・§12.1）。pull request で lint → typecheck → test を流す
# main への push では deploy.yml がこれを呼んでから先に進む（同じテストを 2 回流さないため）
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      docker_build:
        description: "docker build を確かめるか（deploy.yml から呼ぶときは false。そちらで作るため）"
        type: boolean
        default: true

permissions:
  contents: read

# 同じブランチの古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      # CI の中だけの使い捨ての PostgreSQL（.devcontainer/compose.yaml と同じ版・同じ管理者）
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beach"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      # .env.example と同じ値。ホストだけ db → localhost（サービスコンテナはランナーのポートに出ている）
      POSTGRES_ADMIN_URL: postgres://postgres:postgres@localhost:5432/beach
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/beach
      MIGRATION_DATABASE_URL: postgres://app_owner:app_owner@localhost:5432/beach
      JOB_DATABASE_URL: postgres://app_job:app_job@localhost:5432/beach
      BACKUP_DATABASE_URL: postgres://app_backup:app_backup@localhost:5432/beach
      # テストが読む値（本物の秘密ではない）。CI には .env がないので、.env.example と同じものをここに置く
      APP_BASE_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-not-for-production
      LOGIN_CODE_HMAC_KEY: ci-login-code-hmac-key-not-for-production
      TERMS_VERSION: 2027-01-31
      MAIL_PROVIDER: console
      MAIL_FROM: noreply@localhost

    steps:
      - uses: actions/checkout@v7

      # pnpm の版は package.json の packageManager から、Node.js の版は .nvmrc から
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: DB のロール・マイグレーション・初期データ（空の DB から通ることを毎回確かめる）
        run: |
          pnpm db:roles
          pnpm db:migrate
          pnpm db:seed

      - run: pnpm lint

      - run: pnpm typecheck

      # TZ=UTC と TZ=Asia/Tokyo の 2 回（package.json の test）
      - run: pnpm test

      # ジョブは本番では 1 ファイルにまとめて動かす（ADR 0035）。まとめたものが実際に動くことを毎回確かめる
      - name: まとめたジョブを動かす（migrate は 2 回・何度流してもよいこと）
        run: |
          pnpm build:jobs
          node dist/jobs/migrate.mjs
          node dist/jobs/migrate.mjs
          node dist/jobs/mail.mjs
          node dist/jobs/daily.mjs

      # 本番のイメージが組み立てられること（コンテナの中では docker を使えないので、ここだけで確かめる）
      - name: docker build（アプリ・ジョブ）
        if: ${{ inputs.docker_build != false }}
        run: |
          docker build -t beachball-portal:ci .
          docker build -f Dockerfile.jobs -t beachball-jobs:ci .
