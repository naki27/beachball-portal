# CI（設計書 §6.6 の手順 1・§12.1）。pull request と main への push で lint → typecheck → test を流す
# デプロイ（イメージの作成・マイグレーション・Cloud Run）はここに入れない（X-02 で別のワークフローにする）
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じブランチの古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      # CI の中だけの使い捨ての PostgreSQL（.devcontainer/compose.yaml と同じ版・同じ管理者）
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beach"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      # .env.example と同じ値。ホストだけ db → localhost（サービスコンテナはランナーのポートに出ている）
      POSTGRES_ADMIN_URL: postgres://postgres:postgres@localhost:5432/beach
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/beach
      MIGRATION_DATABASE_URL: postgres://app_owner:app_owner@localhost:5432/beach
      JOB_DATABASE_URL: postgres://app_job:app_job@localhost:5432/beach
      BACKUP_DATABASE_URL: postgres://app_backup:app_backup@localhost:5432/beach

    steps:
      - uses: actions/checkout@v7

      # pnpm の版は package.json の packageManager から、Node.js の版は .nvmrc から
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: DB のロールとマイグレーション
        run: |
          pnpm db:roles
          pnpm db:migrate

      - run: pnpm lint

      - run: pnpm typecheck

      # TZ=UTC と TZ=Asia/Tokyo の 2 回（package.json の test）
      - run: pnpm test
